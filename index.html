<!DOCTYPE html>
<html lang="en">
    <head>          
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IoT Based Broiler Cage Monitoring System</title>
        <link rel="shortcut icon" href="images\AB.png" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
        
        <!-- Inline styles for the header layout and new navigation buttons so they match your dark theme seamlessly -->
        <style>
            .header-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            .nav-buttons {
                display: flex;
                gap: 0.75rem;
                flex-wrap: wrap;
            }

            .nav-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.6rem 1.15rem;
                background-color: #1c1c1e;
                color: #ffffff;
                text-decoration: none;
                font-family: inherit;
                font-size: 0.85rem;
                font-weight: 600;
                letter-spacing: 0.04em;
                border: 1px solid #2b6cb0;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(43, 108, 176, 0.2);
                transition: all 0.2s ease-in-out;
                cursor: pointer;
            }

            .nav-btn:hover {
                background-color: #2b6cb0;
                border-color: #63b3ed;
                box-shadow: 0 0 14px rgba(99, 179, 237, 0.45);
                transform: translateY(-1px);
            }

            .nav-btn:active {
                transform: translateY(0);
            }

            .nav-btn svg {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
            }

            /* Responsive adjustment for smaller screens */
            @media (max-width: 768px) {
                .header-bar {
                    flex-direction: column;
                    align-items: flex-start;
                }
                .nav-buttons {
                    width: 100%;
                }
                .nav-btn {
                    flex: 1;
                    justify-content: center;
                }
            }
        </style>
    </head>

    <body>

        <div id="outer-container">
            <!-- Header Bar containing the Title and the two external link buttons -->
            <div class="header-bar">
                <span class="title-container">
                    <h1 id="title">IoT Based Broiler Cage Monitoring System</h1>
                </span>

                <div class="nav-buttons">
                    <!-- Link 1: Control Settings -->
                    <a href="https://kaiser691.github.io/BroilerCageControlSettings/" target="_blank" rel="noopener noreferrer" class="nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Control Settings
                    </a>

                    <!-- Link 2: Pi Capture -->
                    <a href="https://kaiser691.github.io/BroilerPiCapture/" target="_blank" rel="noopener noreferrer" class="nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Pi Capture
                    </a>
                </div>
            </div>

            <div id="data-container">
                <div class="gauge-container">
                    <p>Environmental Gauges</p>
                    <div class="environmental-box-container">
                        <div class="gauge temperature">
                            <div class="gauge-arc temperature-arc"></div>
                            <div class="needle temperature-needle"></div>
                            <div class="gauge-info">
                            <span class="value">30</span>
                            <span class="label">TEMPERATURE</span>
                            </div>
                        </div>
                        <div class="gauge humidity">
                            <div class="gauge-arc humidity-arc"></div>
                            <div class="needle humidity-needle"></div>
                            <div class="gauge-info">
                            <span class="value">30</span>
                            <span class="label">HUMIDITY</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="resource-waste-gauges" class="gauge-container">
                    <p>Resource/Waste Gauges</p>
                    <div class="bars-container">
                        <div class="bar-wrapper feeder">
                            <div class="percentage-row">
                                <span class="percentage" id="feeder-1-percentage">7%</span>
                                <span class="warning-icon" id="feeder-1-warning">⚠️</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill feeder-bar-fill-1"></div>
                            </div>
                            <span class="label">FEEDER<br>CONTAINER 1</span>
                        </div>

                        <div class="bar-wrapper feeder">
                            <div class="percentage-row">
                                <span class="percentage" id="feeder-2-percentage">7%</span>
                                <span class="warning-icon" id="feeder-2-warning">⚠️</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill feeder-bar-fill-2"></div>
                            </div>
                            <span class="label">FEEDER<br>CONTAINER 2</span>
                        </div>

                        <div class="bar-wrapper water">
                            <div class="percentage-row">
                                <span class="percentage" id="water-percentage">90%</span>
                                <span class="warning-icon" id="water-warning">⚠️</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill water-bar-fill"></div>
                            </div>
                            <span class="label">WATER<br>CONTAINER</span>
                        </div>
                        <!--
                        <div class="bar-wrapper waste">
                            <div class="percentage-row">
                                <span class="percentage" id="waste-percentage">45%</span>
                                <span class="warning-icon" id="waste-warning">⚠️</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill waste-bar-fill"></div>
                            </div>
                            <span class="label">WASTE<br>ACCUMLATION</span>
                        </div>
                        -->
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="firebase.js"></script>
        <script src="script.js"></script>
    </body>
</html>
